<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
</head>

<body>
    <script>
        let originalNumber = Math.floor(Math.random() * 100) + 1;
        let guess = 0;
        while (true) {
            let userguess = Number(prompt("Enter the number 1 to 100"));
            guess++;
            if (userguess === originalNumber) {
                alert("Congratulation ! you guess correct answer");
                alert("Your score is" + (100 - guess));
                break;
            }
            else if (userguess > originalNumber) {
                alert("Your guess number is greater than original number try again!");
            }
            else {
                alert("Your guess number is lesser than original number try again!");
            }
        }
    </script>
</body>

</html>
