<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .card {
            display: flex;
            justify-content: center;
            align-items: center;

            border: 2px solid black;
            position: relative;

            width: 1068px;
            padding: 12px;
            margin: 5px;

            gap: 25px;

            background-color: rgb(31, 27, 27);
        }

        .image {
            position: relative;
            flex-shrink: 0;
        }

        .image img {
            width: 300px;
            display: block;
        }

        .image .capsule {
            position: absolute;

            right: 5px;
            bottom: 4px;

            padding: 3px;

            border-radius: 3px;

            background-color: #242020;
            color: white;

            opacity: 0.9;

            font-size: 14px;
        }

        .text {
            flex: 1;
        }

        .text h1 {
            color: white;
            font-size: 25px;
            line-height: 1.3;
            padding: 2px 0;
        }

        .text p {
            color: white;
            font-size: 15px;
            padding: 10px 0;
        }

        @media (max-width: 800px) {

            .card {
                width: 95%;
                flex-direction: column;
                align-items: flex-start;
            }

            .image img {
                width: 100%;
            }

            .text h1 {
                font-size: 20px;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <div class="image">

                <img
                    src="https://i.ytimg.com/vi/tVzUXW6siu0/hqdefault.jpg"
                    alt="VS Code Tutorial">

                <div class="capsule">
                    31:20
                </div>

            </div>

            <div class="text">

                <h1>
                    Installing VS Code & How Websites Work |
                    Sigma Web Development Course - Tutorial #1
                </h1>

                <p>
                    CodeWithHarry · 727K views · 2 months ago
                </p>

            </div>

        </div>

    </div>

</body>

</html>
