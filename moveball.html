<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solution 8</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            position: relative;
            height: 80vh;
            width: 100%;
            background-color: aquamarine;
            overflow: hidden;
        }

        .box {
            height: 100px;
            width: 100px;
            background-color: red;
            border-radius: 50%;

            position: absolute;
            bottom: 0;
            left: 0;

            animation:
                animateX 3s linear infinite,
                animateY 1s ease-out infinite alternate;
        }

        @keyframes animateX {
            from {
                left: 0;
            }

            to {
                left: calc(100% - 100px);
            }
        }

        @keyframes animateY {
            from {
                bottom: 0;
            }

            to {
                bottom: calc(100% - 100px);
            }
        }
    </style>

</head>

<body>

    <div class="container">
        <div class="box"></div>
    </div>

</body>

</html>
