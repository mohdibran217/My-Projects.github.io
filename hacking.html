<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Terminal Simulation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #00ff00;
            font-family: "Courier New", monospace;
            font-size: 24px;
            padding: 30px;
            min-height: 100vh;
        }

        #terminal {
            max-width: 900px;
            margin: auto;
        }

        .line {
            margin: 12px 0;
            text-shadow: 0 0 5px #00ff00;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 24px;
            background-color: #00ff00;
            margin-left: 5px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .completed {
            color: #00ff00;
        }

        .warning {
            color: #ffff00;
        }
    </style>
</head>

<body>

    <div id="terminal">
        <div class="line" id="current">
            Initializing simulation<span class="cursor"></span>
        </div>
    </div>

    <script>

        const messages = [
            "Initializing simulation",
            "Loading demonstration files",
            "Checking system status",
            "Running security test",
            "Analyzing sample data",
            "Testing system response",
            "Simulation completed"
        ];

        const terminal = document.getElementById("terminal");

        function randomDelay() {
            return new Promise(resolve => {
                const delay = 1000 + Math.random() * 6000;

                setTimeout(resolve, delay);
            });
        }

        function createLine(message) {

            const div = document.createElement("div");

            div.className = "line completed";

            div.textContent = message + "...";

            terminal.appendChild(div);
        }

        async function runSimulation() {

            const current = document.getElementById("current");

            for (let i = 0; i < messages.length; i++) {

                current.firstChild.textContent = messages[i];

                await randomDelay();

                current.remove();

                createLine(messages[i]);

                if (i < messages.length - 1) {

                    const newLine = document.createElement("div");

                    newLine.className = "line";

                    newLine.id = "current";

                    newLine.innerHTML =
                        messages[i + 1] +
                        '<span class="cursor"></span>';

                    terminal.appendChild(newLine);
                }
            }

            const finalMessage = document.createElement("div");

            finalMessage.className = "line warning";

            finalMessage.textContent =
                "NOTE: This is a fictional educational simulation.";

            terminal.appendChild(finalMessage);
        }

        runSimulation();

    </script>

</body>

</html>
