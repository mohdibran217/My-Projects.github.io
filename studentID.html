<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GLA Student ID Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
        }

        h1 {
            text-align: center;
            width: 92vw;
            font-size: 45px;
            color: rgb(44, 120, 134);
            font-weight: bolder;
            margin: 20px auto;
        }

        marquee {
            width: 37vw;
            border: 10px dashed rgb(44, 120, 134);
        }

        .container {
            width: 325px;
            height: 495px;
            background-color: rgb(44, 120, 134);
            margin: 0 auto;
            border-radius: 10px;
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
            overflow: hidden;
        }

        .image {
            width: 325px;
            height: 95px;
            object-fit: cover;
        }

        .student {
            text-align: center;
            background-color: white;
            padding: 5px;
            font-weight: bold;
        }

        .name {
            color: white;
            border: 2px solid black;
            background-color: black;
            text-align: center;
            padding: 5px;
            font-weight: bold;
        }

        .photos {
            margin: 10px;
            display: flex;
            gap: 8px;
        }

        .photo {
            width: 120px;
            height: 125px;
            border: 2px solid black;
            object-fit: cover;
        }

        .info {
            font-size: 18px;
            padding-top: 10px;
            color: white;
            line-height: 1.4;
        }

        .qr_code {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-left: 10px;
        }

        .qr {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .bar {
            text-align: center;
            font-size: 12px;
            color: white;
        }

        .barqr {
            width: 125px;
            height: 40px;
            object-fit: contain;
        }

        p {
            font-size: 10px;
            text-align: right;
            padding-right: 15px;
            margin: 5px;
            color: white;
        }

        .footer {
            border: 1px solid black;
            background-color: black;
            color: white;
            text-align: center;
            padding: 6px;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <h1>
        <marquee scrollamount="25" direction="right">
            GLA ID Card
        </marquee>
    </h1>

    <div class="container">

        <div class="logo">
            <img class="image" src="image.png" alt="GLA University">
        </div>

        <div class="student">
            Student ID Card
        </div>

        <div class="name">
            Mohammad Ibran
        </div>

        <div class="photos">

            <img class="photo" src="photo.png" alt="Student Photo">

            <div class="info">
                Course / Branch:<br>
                B.Tech. - CS<br>

                Date of Birth:<br>
                16 Nov, 2008<br>

                <b>Validity: 2025-2029</b>
            </div>

        </div>

        <div class="qr_code">

            <img class="qr"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRc9eYGCev1WW9NX5ZxFWqxARKk14wRi6Nam8sKclDvBA&s=10"
                alt="QR Code">

            <div class="bar">

                <img class="barqr"
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpATgHGrWMTR89srhBDUFbs1nbB6RkVMI9A2kHJtdATQ&s=10"
                    alt="Barcode">

                <br>

                <b>25BCS1870</b>

            </div>

        </div>

        <p>
            <b>Dean-Academic Affairs</b>
        </p>

        <div class="footer">
            WWW.gla.ac.in
        </div>

    </div>

</body>

</html>
